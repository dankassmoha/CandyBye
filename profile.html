<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный кабинет пользователя на CandyBye — ваш профиль, бонусы, история заказов и многое другое.">
    <title>Личный кабинет - CandyBye</title>
    <link rel="icon" href="image/icon.jpg" sizes="16x16" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="32x32" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="192x192" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="512x512" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body class="index">

    <!-- Контейнер с фоном -->
    <div class="background-container"></div>

     <!-- Шапка -->
     <header>
        <img src="image/logo.png" alt="CandyBye Logo" class="logo">
        <nav>
            <a href="main.html">Главная</a>
            <a href="#category1">Снеки</a>
            <a href="#category2">Напитки</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Личный кабинет</a> <!-- Вкладка личного кабинета -->
        </nav>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <!-- Мобильное меню -->
        <div class="mobile-nav">
            <a href="main.html">Главная</a>
            <a href="#category1">Снеки</a>
            <a href="#category2">Напитки</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Личный кабинет</a> <!-- Вкладка личного кабинета -->
        </div>
    </header>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.mobile-nav');
            nav.classList.toggle('active');
        }
    </script>

    <!-- Контейнер с профилем -->
    <section class="profile-container">
        <div class="profile-frame">
            <h1>Профиль</h1>

            <!-- Карточка аватара -->
            <div class="card avatar-card animate-fadeUp">
                <div class="avatar-container">
                    <img src="image/account.jpg" alt="Аватар" id="avatar" class="avatar">
                    <div class="avatar-menu" id="avatar-menu">
                        <button class="change-avatar" onclick="changeAvatar()">Сменить аватар</button>
                        <button class="remove-avatar" onclick="removeAvatar()">Удалить аватар</button>
                    </div>
                    <p class="username">Имя пользователя</p>
                    <p class="registration-date">Дата регистрации: </p>
                </div>
            </div>

            <!-- Карточка бонусов -->
            <div class="card animate-fadeUp">
                <h2>Бонусные баллы</h2>
                <p><strong>Ваш счёт:</strong> <span id="bonus">150</span></p>
                <div class="progress-bar">
                    <div style="width: 75%;"></div>
                </div>
            </div>

            <!-- Карточка истории заказов -->
            <div class="card animate-fadeUp">
                <h2>История заказов</h2>
                <div class="order-carousel">
                    <!-- Динамическая генерация заказов через JavaScript -->
                </div>
            </div>

            <!-- Карточка отзывов -->
            <div class="card animate-fadeUp">
                <h2>Отзывы</h2>
                <ul id="reviews">
                    <li>
                        Отличное качество товара!
                        <span class="stars">★★★★★</span>
                    </li>
                    <li>
                        Быстрая доставка, всё в порядке.
                        <span class="stars">★★★★☆</span>
                    </li>
                </ul>
            </div>

            <!-- Кнопка выхода -->
            <button class="logout-button" onclick="logout()">Выйти</button>
        </div>
    </section>

    <script src="profile.js"></script>
</body>
</html>
