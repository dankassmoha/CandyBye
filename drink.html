<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandyBye</title>
    <link rel="icon" href="image/icon.jpg" sizes="16x16" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="32x32" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="192x192" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="512x512" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script> <!-- Подключение AOS -->
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="header-container">
            <img src="image/logo.png" alt="CandyBye Logo" class="logo">
            <nav class="desktop-nav">
                <a href="main.html">Главная</a>
                <a href="drink.html">Напитки</a>
                <a href="snacks.html">Снеки</a>
                <a href="cart.html">Корзина</a>
                <a href="profile.html">Личный кабинет</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <div class="container">
            <!-- Меню фильтров слева -->
            <aside class="filters">
                <h2>Фильтры</h2>
                <div class="filter">
                    <label for="search">Поиск:</label>
                    <input type="text" id="search" placeholder="Поиск по товарам...">
                </div>
                <div class="filter">
                    <label for="category">Категория:</label>
                    <select id="category">
                        <option value="sweets">Сладости</option>
                        <option value="drinks">Напитки</option>
                        <option value="snacks">Снеки</option>
                    </select>
                </div>
                <div class="filter">
                    <label for="price">Цена:</label>
                    <input type="range" id="price" min="0" max="500" step="10">
                    <span>0 - 500 ₽</span>
                </div>
                <div class="filter">
                    <label for="sort">Сортировка:</label>
                    <select id="sort">
                        <option value="popular">По популярности</option>
                        <option value="price">По цене</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
            </aside>

            <!-- Контейнер для карточек товаров -->
            <section class="product-list">
                <div class="product-card" data-aos="fade-up">
                    <img src="image/product1.jpg" alt="Напиток 1">
                    <h3>Напиток 1</h3>
                    <p class="price">150 ₽</p>
                    <div class="rating">
                        <span class="stars">★★★★☆</span>
                    </div>
                    <button class="add-to-cart">Добавить в корзину</button>
                </div>

                <div class="product-card" data-aos="fade-up" data-aos-delay="100">
                    <img src="image/product2.jpg" alt="Напиток 2">
                    <h3>Напиток 2</h3>
                    <p class="price">200 ₽</p>
                    <div class="rating">
                        <span class="stars">★★★☆☆</span>
                    </div>
                    <button class="add-to-cart">Добавить в корзину</button>
                </div>

                <div class="product-card" data-aos="fade-up" data-aos-delay="200">
                    <img src="image/product3.jpg" alt="Напиток 3">
                    <h3>Напиток 3</h3>
                    <p class="price">250 ₽</p>
                    <div class="rating">
                        <span class="stars">★★★★★</span>
                    </div>
                    <button class="add-to-cart">Добавить в корзину</button>
                </div>

                <div class="product-card" data-aos="fade-up" data-aos-delay="300">
                    <img src="image/product4.jpg" alt="Напиток 4">
                    <h3>Напиток 4</h3>
                    <p class="price">180 ₽</p>
                    <div class="rating">
                        <span class="stars">★★☆☆☆</span>
                    </div>
                    <button class="add-to-cart">Добавить в корзину</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <div class="footer-links">
            <a href="/about">О нас</a>
            <a href="/contact">Контакты</a>
        </div>
        <div class="social-media">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
    </footer>

    <script>
        // Инициализация AOS
        AOS.init();

        // Фильтрация товаров по поисковому запросу
        document.getElementById('search').addEventListener('input', function() {
            let query = this.value.toLowerCase();
            let productCards = document.querySelectorAll('.product-card');
            productCards.forEach(function(card) {
                let title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
