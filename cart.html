<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - CandyBye</title>
    <link rel="icon" href="image/icon.jpg" sizes="16x16" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="32x32" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="192x192" type="image/jpeg">
    <link rel="icon" href="image/icon.jpg" sizes="512x512" type="image/jpeg">
    <link rel="stylesheet" href="cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Шапка сайта -->
     <!-- Шапка -->
     <header>
        <img src="image/logo.png" alt="CandyBye Logo" class="logo">
        <nav>
            <a href="main.html">Главная</a>
            <a href="#category1">Снеки</a>
            <a href="#category2">Напитки</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Личный кабинет</a> <!-- Вкладка личного кабинета -->
        </nav>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <!-- Мобильное меню -->
        <div class="mobile-nav">
            <a href="main.html">Главная</a>
            <a href="#category1">Снеки</a>
            <a href="#category2">Напитки</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Личный кабинет</a> <!-- Вкладка личного кабинета -->
        </div>
    </header>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.mobile-nav');
            nav.classList.toggle('active');
        }
    </script>
    
    <!-- Основной блок с корзиной -->
    <main>
        <div class="cart-container">
            <h1>Корзина</h1>
            
            <!-- Список товаров в корзине -->
            <div id="cart-items">
                <!-- Пример товара -->
                <div class="cart-item" data-id="1">
                    <img src="candy1.jpg" alt="Сладость 1">
                    <div class="item-details">
                        <h3>Леденец</h3>
                        <p>Цена: <span class="price">100</span> руб.</p>
                        <div class="quantity">
                            <button class="decrease">-</button>
                            <input type="number" value="1" class="quantity-input" min="1" step="1">
                            <button class="increase">+</button>
                        </div>
                        <button class="remove">Удалить</button>
                        <p class="total">100 руб.</p>
                    </div>
                </div>
                <!-- Здесь будут отображаться другие товары -->
            </div>

            <!-- Итоговая информация -->
            <div class="cart-summary">
                <p>Общая стоимость: <span id="total-price">100</span> руб.</p>
                <button id="checkout-btn" disabled>Оформить заказ</button>
                <button id="continue-shopping-btn">Продолжить покупки</button>
                <button id="clear-cart-btn">Очистить корзину</button>
            </div>
        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
